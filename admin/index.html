<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CSEL 后台管理</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css" />
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a0f; color:#c8c8d0; font:15px/1.7 'Consolas',monospace; min-height:100vh; }
a { color:#1e90ff; text-decoration:none; }
input,textarea,select { font:14px/1.5 'Consolas',monospace; background:#111; border:1px solid #2a2a3a; color:#fff; padding:8px 10px; }
input:focus,textarea:focus,select:focus { border-color:#00d4aa; outline:none; }
button { font:14px 'Consolas',monospace; cursor:pointer; }
.green { color:#00d4aa; }
.red { color:#e74c3c; }
.dim { opacity:.6; }

/* Layout */
.app { display:flex; height:100vh; }
.sidebar { width:220px; background:#0e0e16; border-right:1px solid #2a2a3a; padding:16px 0; flex-shrink:0; }
.sidebar .logo { padding:8px 20px 16px; font-weight:bold; color:#00d4aa; font-size:17px; border-bottom:1px solid #2a2a3a; margin-bottom:8px; }
.sidebar .nav-item { display:block; padding:8px 20px; color:#aaa; cursor:pointer; }
.sidebar .nav-item:hover, .sidebar .nav-item.active { color:#fff; background:#1a1a28; }
.main { flex:1; overflow-y:auto; padding:24px 32px; }

/* Login */
.login-wrap { max-width:400px; margin:120px auto; padding:0 20px; }
.login-wrap h1 { color:#00d4aa; margin-bottom:16px; }
.login-wrap input { width:100%; margin:8px 0; }
.login-wrap .btn { width:100%; padding:12px; background:#00d4aa; color:#000; border:none; font-weight:bold; margin:12px 0; }
.login-wrap .hint { font-size:13px; }

/* Page */
.page-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.page-bar h2 { color:#00d4aa; }
.btn { padding:8px 16px; border:1px solid #00d4aa; background:transparent; color:#00d4aa; }
.btn:hover { background:#00d4aa; color:#000; }
.btn-sm { padding:4px 10px; font-size:12px; }
.btn-red { border-color:#e74c3c; color:#e74c3c; }
.btn-red:hover { background:#e74c3c; color:#fff; }
.btn-amber { border-color:#f39c12; color:#f39c12; }
.btn-amber:hover { background:#f39c12; color:#000; }

/* Table */
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:10px 12px; border-bottom:1px solid #2a2a3a; }
th { color:#666; font-weight:normal; font-size:13px; }

/* Modal */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; z-index:100; }
.modal { background:#1a1a28; border:1px solid #2a2a3a; width:680px; max-width:90vw; max-height:85vh; overflow-y:auto; padding:24px; }
.modal h3 { color:#00d4aa; margin-bottom:16px; }
.modal label { display:block; margin:12px 0 4px; font-size:13px; opacity:.7; }
.modal input, .modal textarea { width:100%; }
.modal textarea { min-height:50vh; }
.modal .btns { display:flex; gap:10px; margin-top:16px; }

/* Rich Editor */
.editor-wrap { display:flex; flex-direction:column; gap:0; }
.editor-toolbar { display:flex; flex-wrap:wrap; gap:4px; padding:8px; background:#111; border:1px solid #2a2a3a; border-bottom:none; }
.editor-toolbar button { background:#1a1a28; border:1px solid #2a2a3a; color:#c8c8d0; padding:4px 10px; font-size:13px; cursor:pointer; }
.editor-toolbar button:hover { border-color:#00d4aa; }
.editor-panes { display:flex; gap:0; border:1px solid #2a2a3a; }
.editor-panes textarea, .editor-preview { width:50%; min-height:55vh; padding:12px; font:14px/1.6 'Consolas',monospace; }
.editor-panes textarea { background:#0a0a0f; color:#c8c8d0; border:none; resize:none; }
.editor-preview { background:#0e0e16; color:#c8c8d0; border-left:1px solid #2a2a3a; overflow-y:auto; }
.editor-preview h1, .editor-preview h2 { color:#00d4aa; }
.editor-preview a { color:#1e90ff; }
.editor-preview code { background:#1a1a28; padding:2px 6px; border-radius:3px; }
.editor-preview pre { background:#1a1a28; padding:12px; overflow-x:auto; }
.editor-preview img { max-width:100%; }
.editor-preview blockquote { border-left:3px solid #00d4aa; padding-left:12px; opacity:.8; }
.katex { font-size:1.1em; }

/* Warning */
.warn { background:#1a1a28; border:1px solid #f39c12; padding:12px 16px; margin:12px 0; font-size:13px; }
.warn b { color:#f39c12; }

/* ── Mobile Responsive ── */
.hamburger { display:none; position:fixed; top:12px; left:12px; z-index:200; background:none; border:1px solid #2a2a3a; color:#00d4aa; font-size:22px; padding:4px 12px; cursor:pointer; }
.sidebar-overlay { display:none; }
@media (max-width:768px) {
  body { font-size:14px; }
  .hamburger { display:block; }
  .app { display:block; position:relative; padding-top:50px; }
  .sidebar { position:fixed; left:-240px; top:0; bottom:0; width:240px; z-index:150; transition:left .25s; }
  .sidebar.open { left:0; }
  .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:140; }
  .sidebar-overlay.show { display:block; }
  .main { padding:16px; }
  .page-bar { flex-direction:column; align-items:stretch; gap:8px; }
  .page-bar h2 { font-size:18px; }
  table { display:block; overflow-x:auto; }
  th, td { padding:8px; font-size:13px; white-space:nowrap; }
  .btn { padding:10px 16px; min-height:44px; }
  .btn-sm { padding:8px 12px; min-height:36px; }
  input, textarea { font-size:16px !important; } /* 防 iOS 缩放 */
  .modal { width:95vw; max-width:none; margin:10px; padding:16px; }
  .modal textarea { min-height:40vh; }
  .login-wrap { margin:80px auto; }
  .login-wrap input { font-size:16px; min-height:44px; }
  .login-wrap .btn { min-height:48px; }
}
</style>
</head>
<body>

<div id="app"></div>

<script>
const REPO = 'MEMZ-CHROER/dllHNWeb';
const BRANCH = 'master';
const SITE = '.';
var shaMap = {};

// ── 密码 ──
var _pwHex = '447265616447656d34323233393436';
var _loggedIn = false;

// ── GitHub API ──
function gh(url, opts) {
  return fetch('/api' + url, Object.assign({
    headers: { Accept: 'application/vnd.github.v3+json' }
  }, opts || {})).then(function(r) {
    return r.json().catch(function() {
      return r.text().then(function(t) { throw new Error('HTTP ' + r.status + ': ' + t.substring(0,80)); });
    });
  });
}

function ghRaw(url) {
  return fetch('/raw' + url, {
    headers: { Accept: 'application/vnd.github.v3.raw' }
  }).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + url);
    return r.text().then(function(t) {
      // Check if API returned JSON instead of raw content
      if (t.charAt(0) === '{' || t.charAt(0) === '[') {
        try { var j = JSON.parse(t); if (j.name || j.message) throw new Error('API returned JSON: ' + (j.message || j.name)); } catch(e) { if (e.message.indexOf('API')>-1) throw e; }
      }
      return t;
    });
  });
}

function b64enc(s) { return btoa(unescape(encodeURIComponent(s))); }
function b64dec(s) { return decodeURIComponent(escape(atob(s))); }

// ── Page States ──
var state = 'pages';

function toggleSidebar() {
  var s = document.querySelector('.sidebar');
  var o = document.querySelector('.sidebar-overlay');
  if (s) s.classList.toggle('open');
  if (o) o.classList.toggle('show');
}

function render() {
  if (!_loggedIn) return renderLogin();
  var html = '';
  html += '<button class="hamburger" onclick="toggleSidebar()">☰</button>';
  html += '<div class="sidebar-overlay" onclick="toggleSidebar()"></div>';
  html += '<div class="app">';
  html += '<div class="sidebar">';
  html += '<div class="logo">[CSEL] Admin</div>';
  html += '<a class="nav-item'+(state==='pages'?' active':'')+'" onclick="go(\'pages\')">📄 页面管理</a>';
  html += '<a class="nav-item'+(state==='navbar'?' active':'')+'" onclick="go(\'navbar\')">🔗 导航栏</a>';
  html += '<a class="nav-item'+(state==='new'?' active':'')+'" onclick="go(\'new\')">➕ 新建页面</a>';
  html += '<a class="nav-item'+(state==='settings'?' active':'')+'" onclick="go(\'settings\')">⚙ 站点设置</a>';
  html += '<a class="nav-item'+(state==='style'?' active':'')+'" onclick="go(\'style\')">🎨 样式编辑器</a>';
  html += '<a class="nav-item" onclick="logout()" style="color:#666;margin-top:20px;">🚪 退出</a>';
  html += '</div>';
  html += '<div class="main" id="main"></div>';
  html += '</div>';
  document.getElementById('app').innerHTML = html;
  loadPage();
}

function go(s) { state=s; render(); }

function logout() { render(); }

// ── Render Login ──
function _hex(s) { var r='';for(var i=0;i<s.length;i+=2)r+=String.fromCharCode(parseInt(s.substr(i,2),16));return r; }
window.login = function() {
  var v = document.getElementById('t').value;
  if (v === _hex(_pwHex)) {
    _loggedIn = true;
    render();
  } else {
    document.getElementById('app').innerHTML = '<div class="login-wrap"><h1>[CSEL] 后台管理</h1><p class="red">❌ 密码错误</p><input type="password" id="t" placeholder="密码" /><button class="btn" onclick="login()">登录</button></div>';
  }
};

function renderLogin() {
  document.getElementById('app').innerHTML = '<div class="login-wrap"><h1>[CSEL] 后台管理</h1><p class="dim">输入管理密码</p><input type="password" id="t" placeholder="密码" /><button class="btn" onclick="login()">登录</button></div>';
}

// ── Page List ──
function loadPage() {
  if (state === 'pages') loadList();
  else if (state === 'navbar') loadNavbar();
  else if (state === 'new') loadNew();
  else if (state === 'settings') loadSettings();
  else if (state === 'style') loadStyle();
}

function loadList() {
  document.getElementById('main').innerHTML = '<p>加载中...</p>';
  gh('/repos/' + REPO + '/git/trees/' + BRANCH + '?recursive=1').then(function(data) {
    if (data.message) { document.getElementById('main').innerHTML = '<p class="red">' + data.message + '</p>'; return; }
    var mds = data.tree.filter(function(f) { return (f.path.endsWith('.md') || f.path.endsWith('.html')) && f.path.indexOf('node_modules')===-1 && f.path !== 'README.md'; });
    data.tree.forEach(function(f) { shaMap[f.path] = f.sha; });

    var html = '<div class="page-bar"><h2>📄 页面管理</h2><button class="btn" onclick="go(\'new\')">+ 新建页面</button></div>';
    html += '<table><tr><th>文件</th><th>标题</th><th style="width:240px">操作</th></tr>';
    mds.forEach(function(f) {
      var title = f.path.replace('.md','').replace(/^content\/pages\//,'').replace(/\//g,' / ');
      html += '<tr><td><a href="' + SITE + '/' + f.path.replace('.md','') + '" target="_blank">' + f.path + '</a></td>';
      html += '<td class="dim">' + title + '</td>';
      html += '<td><button class="btn btn-sm" onclick="editFile(\'' + f.path + '\')">编辑</button> ';
      html += '<button class="btn btn-sm btn-amber" onclick="quickPublish(\'' + f.path + '\')">⚡发布</button> ';
      html += '<button class="btn btn-sm btn-red" onclick="delFile(\'' + f.path + '\')">删除</button></td></tr>';
    });
    html += '</table><p class="dim" style="margin-top:8px">⚡发布 = 直接提交 HTML 版本，立刻生效（不等 Pages 构建）</p>';
    document.getElementById('main').innerHTML = html;
  });
}

// ── Edit File ──
function editFile(path) {
  ghRaw('/repos/' + REPO + '/contents/' + path + '?ref=' + BRANCH).then(function(content) {
    showModal(path, content);
  });
}

function showModal(path, content) {
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  // Build HTML with array to avoid template literal backtick issues
  var h = [];
  h.push('<div class="modal" style="width:90vw;max-width:960px;">');
  h.push('<h3>编辑: ' + escHtml(path) + '</h3>');
  h.push('<label style="margin-bottom:4px">文件名</label><input type="text" id="mpath" value="' + escHtml(path) + '" style="margin-bottom:8px" />');
  h.push('<div class="editor-wrap"><div class="editor-toolbar" id="modalToolbar"></div><div class="editor-panes">');
  h.push('<textarea id="mcontent" oninput="previewMd()">' + escHtml(content||'') + '</textarea>');
  h.push('<div class="editor-preview" id="mdPreview"></div>');
  h.push('</div></div>');
  h.push('<div class="btns" style="margin-top:8px">');
  h.push('<button class="btn" onclick="saveModal()">💾 保存</button>');
  h.push('<button class="btn btn-red" onclick="closeModal()">取消</button></div></div>');
  overlay.innerHTML = h.join('');
  document.body.appendChild(overlay);
  window._modalPath = path;
  buildToolbar('modalToolbar', 'modal');
  if (!window.marked) loadEditorLibs(function() { previewMd(); });
  else setTimeout(previewMd, 100);
}

function buildToolbar(containerId, fnPrefix) {
  var tb = document.getElementById(containerId);
  if (!tb) return;
  var btns = [
    ['**','**','B','粗体'],['*','*','I','斜体'],['## ','','H','标题'],
    ['---\n','','—','分隔线'],['[','](url)','🔗','链接'],['![](','?)','🖼','图片'],
    ['\n\n```\n','\n```\n','</>','代码'],['\n- ','','•','列表'],
    ['\n> ','','❝','引用'],['$$\n','\n$$','∑','公式'],['$','$','∫','行内公式']
  ];
  btns.forEach(function(b) {
    var btn = document.createElement('button');
    btn.innerHTML = b[2];
    btn.title = b[3];
    btn.onclick = function() {
      var ta = document.getElementById(fnPrefix === 'modal' ? 'mcontent' : 'ncontent');
      if (!ta) return;
      var start = ta.selectionStart, end = ta.selectionEnd;
      var sel = ta.value.substring(start, end) || b[3];
      ta.value = ta.value.substring(0, start) + b[0] + sel + b[1] + ta.value.substring(end);
      ta.focus();
      if (fnPrefix === 'modal') previewMd(); else previewNew();
    };
    tb.appendChild(btn);
  });
}

function ins(before, after, hint) {} // legacy

function loadEditorLibs(cb) {
  var loaded = 0;
  function check() { if (++loaded >= 2 && cb) cb(); }
  var s1 = document.createElement('script');
  s1.src = 'https://cdn.jsdelivr.net/npm/marked/marked.min.js';
  s1.onload = check;
  document.head.appendChild(s1);
  var s2 = document.createElement('script');
  s2.src = 'https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js';
  s2.onload = check;
  document.head.appendChild(s2);
}

function previewMd() {
  var ta = document.getElementById('mcontent');
  var preview = document.getElementById('mdPreview');
  if (!ta || !preview) return;
  if (!window.marked) { preview.innerHTML = '<p class="dim">加载渲染器...</p>'; return; }
  var html = window.marked.parse(ta.value || '', { breaks: true });
  // Render LaTeX blocks
  if (window.katex) {
    html = html.replace(/\$\$([\s\S]*?)\$\$/g, function(_, m) {
      try { return '<div style="text-align:center;padding:8px 0">' + katex.renderToString(m.trim(), {displayMode:true,throwOnError:false}) + '</div>'; } catch(e) { return '<div class="red">❌ ' + escHtml(m) + '</div>'; }
    });
    html = html.replace(/\$([^$\n]+?)\$/g, function(_, m) {
      try { return katex.renderToString(m.trim(), {displayMode:false,throwOnError:false}); } catch(e) { return '$' + escHtml(m) + '$'; }
    });
  }
  preview.innerHTML = html;
}

window.saveModal = function() {
  var path = document.getElementById('mpath').value.trim();
  var content = document.getElementById('mcontent').value;
  if (!path || !content) return;
  closeModal();
  var main = document.getElementById('main');
  main.innerHTML = '<p>保存中...</p>';

  var body = { message: 'update ' + path, content: b64enc(content), branch: BRANCH };
  if (shaMap[path]) body.sha = shaMap[path];

  gh('/repos/' + REPO + '/contents/' + path, { method: 'PUT', body: JSON.stringify(body) }).then(function(d) {
    if (d.content) { shaMap[path] = d.content.sha; loadList(); }
    else main.innerHTML = '<p class="red">保存失败: ' + (d.message||'unknown') + '</p>';
  });
};

window.closeModal = function() {
  var el = document.querySelector('.modal-overlay');
  if (el) el.remove();
};

// ── Quick Publish (render HTML immediately) ──
window.quickPublish = function(path) {
  var main = document.getElementById('main');
  main.innerHTML = '<p>⚡ 渲染并发布 ' + path + '...</p>';

  // Load marked if not yet loaded
  if (!window.marked) {
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/marked/marked.min.js';
    s.onload = function() { doPublish(path); };
    document.body.appendChild(s);
  } else {
    doPublish(path);
  }
};

function doPublish(path) {
  var main = document.getElementById('main');
  ghRaw('/repos/' + REPO + '/contents/' + path + '?ref=' + BRANCH).then(function(md) {
    // Get layout for wrapper
    ghRaw('/repos/' + REPO + '/contents/_layouts/default.html?ref=' + BRANCH).then(function(layout) {
      // Debug: check first 50 chars
      if (layout.charAt(0) === '{') {
        main.innerHTML = '<p class="red">❌ API 返回了 JSON 而非文件内容。token 可能权限不足。</p>';
        return;
      }
      var htmlPath = path.replace('.md', '.html');
      var title = path.replace('.md','').split('/').pop();

      // Extract YAML frontmatter title
      var titleMatch = md.match(/^---[\s\S]*?title:\s*(.+)[\s\S]*?---/);
      if (titleMatch) title = titleMatch[1].trim();

      // Strip frontmatter, render markdown
      var body = md.replace(/^---[\s\S]*?---\s*/, '');
      var rendered = marked.parse(body);

      // Build complete HTML: replace layout vars FIRST, then content last
      var pageHtml = layout
        .replace(/{{ page\.title }}/g, title)
        .replace(/{{ site\.title }}/g, 'DllHN · CSEL')
        .replace(/{{ site\.baseurl }}/g, '')
        .replace(/{{ page\.url }}/g, '/' + htmlPath)
        .replace(/{{ content }}/g, function() { return rendered; });

      // Get SHA if html file already exists
      var sha = null;
      if (shaMap[htmlPath]) sha = shaMap[htmlPath];

      var body2 = { message: 'quick publish ' + htmlPath, content: b64enc(pageHtml), branch: BRANCH };
      if (sha) body2.sha = sha;

      main.innerHTML = '<p>⏫ 提交 HTML 到 GitHub...</p>';
      gh('/repos/' + REPO + '/contents/' + htmlPath, { method: 'PUT', body: JSON.stringify(body2) }).then(function(d) {
        if (d.content) {
          shaMap[htmlPath] = d.content.sha;
          main.innerHTML = '<p class="green">✅ 静态页已发布！<a href="/' + htmlPath + '" target="_blank">立即查看</a></p>';
          // 同时触发 Pages 重建，让 Jekyll 版也跟上
          main.innerHTML += '<p class="dim">⏫ 正在触发 Pages 重建...</p>';
          gh('/repos/' + REPO + '/pages/builds', { method: 'POST' }).then(function(b) {
            main.innerHTML += '<p class="green">✅ Pages 重建中（约 30 秒），刷新后可用 Jekyll 版本</p>';
          }).catch(function(e) {
            main.innerHTML += '<p class="dim">⚠ Pages 重建触发失败（不影响已发布的静态页）</p>';
          });
        } else {
          main.innerHTML = '<p class="red">发布失败: ' + (d.message||'') + '</p>';
        }
      });
    });
  }).catch(function(e) {
    main.innerHTML = '<p class="red">发布失败: ' + e.message + '</p>';
  });
}

window.delFile = function(path) {
  if (!confirm('确定删除 ' + path + ' ？')) return;
  var sha = shaMap[path];
  if (!sha) { alert('找不到文件 SHA'); return; }
  document.getElementById('main').innerHTML = '<p>删除中...</p>';
  gh('/repos/' + REPO + '/contents/' + path, {
    method: 'DELETE',
    body: JSON.stringify({ message: 'delete ' + path, sha: sha, branch: BRANCH })
  }).then(function(d) {
    if (!d.message || d.message === 'delete ' + path) loadList();
    else document.getElementById('main').innerHTML = '<p class="red">删除失败: ' + (d.message||'unknown') + '</p>';
  });
};

// ── New Page ──
function loadNew() {
  var defaultContent = '---\ntitle: 新页面\n---\n\n在这里写内容...';
  var html = '<div class="page-bar"><h2>➕ 新建页面</h2></div>';
  html += '<label style="display:block;margin:8px 0 4px;opacity:.7">文件名 (不含 .md)</label>';
  html += '<input type="text" id="npath" placeholder="my-page" />';
  html += '<div class="editor-wrap" style="margin-top:8px"><div class="editor-toolbar" id="newToolbar"></div>';
  html += '<div class="editor-panes">';
  html += '<textarea id="ncontent" oninput="previewNew()">' + escHtml(defaultContent) + '</textarea>';
  html += '<div class="editor-preview" id="newPreview"></div></div></div>';
  html += '<div style="margin-top:12px"><button class="btn" onclick="createPage()">创建页面</button></div>';
  document.getElementById('main').innerHTML = html;
  buildToolbar('newToolbar', 'new');
  loadEditorLibs(function() { previewNew(); });
}

function previewNew() {
  var ta = document.getElementById('ncontent');
  var preview = document.getElementById('newPreview');
  if (!ta || !preview) return;
  if (!window.marked) { preview.innerHTML = '<p class="dim">加载渲染器...</p>'; return; }
  var html = window.marked.parse(ta.value || '', { breaks: true });
  if (window.katex) {
    html = html.replace(/\$\$([\s\S]*?)\$\$/g, function(_, m) {
      try { return '<div style="text-align:center;padding:8px 0">' + katex.renderToString(m.trim(), {displayMode:true,throwOnError:false}) + '</div>'; } catch(e) { return '<div class="red">❌ ' + escHtml(m) + '</div>'; }
    });
    html = html.replace(/\$([^$\n]+?)\$/g, function(_, m) {
      try { return katex.renderToString(m.trim(), {displayMode:false,throwOnError:false}); } catch(e) { return '$' + escHtml(m) + '$'; }
    });
  }
  preview.innerHTML = html;
}

window.createPage = function() {
  var name = document.getElementById('npath').value.trim();
  var content = document.getElementById('ncontent').value;
  if (!name) { alert('请输入文件名'); return; }
  var path = name + (name.endsWith('.md') ? '' : '.md');
  document.getElementById('main').innerHTML = '<p>创建中...</p>';
  gh('/repos/' + REPO + '/contents/' + path, {
    method: 'PUT',
    body: JSON.stringify({ message: 'create ' + path, content: b64enc(content), branch: BRANCH })
  }).then(function(d) {
    if (d.content) { shaMap[path] = d.content.sha; go('pages'); }
    else document.getElementById('main').innerHTML = '<p class="red">创建失败: ' + (d.message||'unknown') + '</p>';
  });
};

// ── Navbar Editor ──
// ── 站点设置 ──
function loadSettings() {
  var main = document.getElementById('main');
  main.innerHTML = '<p>加载中...</p>';
  gh('/repos/' + REPO + '/contents/_config.yml?ref=' + BRANCH).then(function(meta) {
    if (!meta || meta.message) { main.innerHTML = '<p class="red">' + (meta ? meta.message : '空响应') + '</p>'; return; }
    window._cfgSha = meta.sha;
    var raw = meta.content.replace(/\n/g, '').replace(/\r/g, '');
    var txt = atob(raw);
    try { txt = decodeURIComponent(escape(txt)); } catch(e) {}
    // Parse simple YAML fields
    var fields = { title: getYaml(txt,'title'), description: getYaml(txt,'description'), url: getYaml(txt,'url'), baseurl: getYaml(txt,'baseurl') };
    main.innerHTML =
      '<div class="page-bar"><h2>⚙ 站点设置</h2></div>' +
      '<label style="display:block;margin:12px 0 4px;opacity:.7">网站标题</label>' +
      '<input type="text" id="s_title" value="' + escHtml(fields.title) + '" style="width:100%" />' +
      '<label style="display:block;margin:12px 0 4px;opacity:.7">描述</label>' +
      '<input type="text" id="s_desc" value="' + escHtml(fields.description) + '" style="width:100%" />' +
      '<label style="display:block;margin:12px 0 4px;opacity:.7">URL</label>' +
      '<input type="text" id="s_url" value="' + escHtml(fields.url) + '" style="width:100%" />' +
      '<label style="display:block;margin:12px 0 4px;opacity:.7">Base URL</label>' +
      '<input type="text" id="s_base" value="' + escHtml(fields.baseurl) + '" style="width:100%" />' +
      '<div style="margin-top:16px"><button class="btn" onclick="saveSettings()">💾 保存设置</button> <span id="cfgStatus" class="dim"></span></div>';
  }).catch(function(e) {
    main.innerHTML = '<p class="red">加载失败: ' + (e.message||e) + '</p>';
  });
}

function getYaml(txt, key) {
  var re = new RegExp('^' + key + ':\\s*"?([^"\\n]+)', 'm');
  var m = txt.match(re);
  return m ? m[1].trim().replace(/["']$/,'') : '';
}

window.saveSettings = function() {
  var sha = window._cfgSha;
  var title = document.getElementById('s_title').value;
  var desc = document.getElementById('s_desc').value;
  var url = document.getElementById('s_url').value;
  var base = document.getElementById('s_base').value;
  var yml = 'title: ' + title + '\ndescription: ' + desc + '\nurl: "' + url + '"\nbaseurl: "' + base + '"\nmarkdown: kramdown\npermalink: /:title/\ninclude:\n  - admin\ndefaults:\n  - scope:\n      path: ""\n    values:\n      layout: "default"\n';
  document.getElementById('cfgStatus').textContent = '保存中...';
  gh('/repos/' + REPO + '/contents/_config.yml', { method: 'PUT', body: JSON.stringify({
    message: 'update site settings',
    content: b64enc(yml),
    sha: sha,
    branch: BRANCH
  })}).then(function(d) {
    if (d.content) { window._cfgSha = d.content.sha; document.getElementById('cfgStatus').textContent = '✅ 已保存'; }
    else document.getElementById('cfgStatus').textContent = '❌ 保存失败: ' + (d.message||'');
  });
};

// ── 样式编辑器（图形化）──
var _styleVars = {};

function loadStyle() {
  var main = document.getElementById('main');
  main.innerHTML = '<p>加载中...</p>';
  gh('/repos/' + REPO + '/contents/assets/css/style.css?ref=' + BRANCH).then(function(meta) {
    if (!meta || meta.message) { main.innerHTML = '<p class="red">' + (meta ? meta.message : '空响应') + '</p>'; return; }
    window._stySha = meta.sha;
    var raw = meta.content.replace(/\n/g, '');
    var txt = atob(raw);
    try { txt = decodeURIComponent(escape(txt)); } catch(e) {}
    window._rawCss = txt;

    // Parse CSS variables
    var vars = {};
    var re = /--([\w-]+)\s*:\s*([^;]+)/g;
    var m;
    while ((m = re.exec(txt)) !== null) vars[m[1]] = m[2].trim();
    _styleVars = vars;

    // Build GUI
    var html = '<div class="page-bar"><h2>🎨 样式编辑器</h2></div>';
    html += '<div style="margin-bottom:12px"><button class="btn" onclick="saveStyleGui()">💾 保存样式</button> <span id="styStatus" class="dim"></span></div>';
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;">';

    // Color variables
    var colorKeys = ['bg','fg','accent','accent2','border','card-bg'];
    colorKeys.forEach(function(k) {
      var val = vars[k] || '#000000';
      html += '<div style="background:#111;border:1px solid #2a2a3a;padding:14px;">';
      html += '<label style="display:block;font-size:13px;opacity:.7;margin-bottom:6px;">--' + k + '</label>';
      html += '<div style="display:flex;gap:10px;align-items:center;">';
      html += '<input type="color" id="cv_' + k + '" value="' + toHex(val) + '" style="width:50px;height:36px;border:none;padding:2px;background:transparent;cursor:pointer;" />';
      html += '<input type="text" id="ct_' + k + '" value="' + escHtml(val) + '" style="flex:1;font-size:13px;" oninput="previewStyle()" />';
      html += '<div id="cp_' + k + '" style="width:28px;height:28px;border-radius:4px;border:1px solid #333;background:' + val + ';"></div>';
      html += '</div></div>';
    });

    html += '</div>';

    // Numeric / text settings
    html += '<div style="margin-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;">';
    var textKeys = Object.keys(vars).filter(function(k) { return colorKeys.indexOf(k) === -1; });
    textKeys.forEach(function(k) {
      var val = vars[k];
      html += '<div style="background:#111;border:1px solid #2a2a3a;padding:14px;">';
      html += '<label style="display:block;font-size:13px;opacity:.7;margin-bottom:6px;">--' + k + '</label>';
      html += '<input type="text" id="vt_' + k + '" value="' + escHtml(val) + '" style="width:100%;font-size:13px;" />';
      html += '</div>';
    });
    html += '</div>';

    // Preview
    html += '<div style="margin-top:16px"><b style="color:#00d4aa">预览</b></div>';
    html += '<div id="stylePreview" style="background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:4px;padding:20px;margin-top:8px;">';
    html += '<span style="color:var(--accent)">强调色文本</span> · ';
    html += '<span style="color:var(--accent2)">链接色</span> · ';
    html += '<span style="background:var(--card-bg);padding:4px 10px;">卡片背景</span>';
    html += '</div>';

    main.innerHTML = html;
  }).catch(function(e) {
    main.innerHTML = '<p class="red">加载失败: ' + (e.message||e) + '</p>';
  });
}

function toHex(color) {
  if (color.startsWith('#')) return color;
  // Simple named or rgb conversion
  var d = document.createElement('div');
  d.style.color = color;
  document.body.appendChild(d);
  var cs = getComputedStyle(d).color;
  document.body.removeChild(d);
  var m = cs.match(/(\d+)/g);
  if (!m) return '#000000';
  return '#' + (1<<24|parseInt(m[0])<<16|parseInt(m[1])<<8|parseInt(m[2])).toString(16).slice(1);
}

function previewStyle() {
  var colorKeys = ['bg','fg','accent','accent2','border','card-bg'];
  var preview = document.getElementById('stylePreview');
  if (!preview) return;
  colorKeys.forEach(function(k) {
    var el = document.getElementById('ct_' + k);
    if (el) preview.style.setProperty('--' + k, el.value);
    var cp = document.getElementById('cp_' + k);
    if (cp) cp.style.background = el ? el.value : '';
  });
}

window.saveStyleGui = function() {
  var css = window._rawCss || '';
  Object.keys(_styleVars).forEach(function(k) {
    var el = document.getElementById('vt_' + k) || document.getElementById('ct_' + k);
    if (el && el.value !== _styleVars[k]) {
      var re = new RegExp('(--' + k + '\\s*:\\s*)[^;]+');
      css = css.replace(re, '$1' + el.value);
    }
  });
  document.getElementById('styStatus').textContent = '保存中...';
  gh('/repos/' + REPO + '/contents/assets/css/style.css', { method: 'PUT', body: JSON.stringify({
    message: 'update style.css',
    content: b64enc(css),
    sha: window._stySha,
    branch: BRANCH
  })}).then(function(d) {
    if (d.content) {
      window._stySha = d.content.sha; window._rawCss = css;
      document.getElementById('styStatus').textContent = '✅ 已保存，触发 Pages 重建...';
      gh('/repos/' + REPO + '/pages/builds', { method: 'POST' }).then(function() {
        document.getElementById('styStatus').textContent = '✅ 已保存，Pages 重建中（~30 秒）';
      }).catch(function() {
        document.getElementById('styStatus').textContent = '✅ 已保存（手动刷新 Pages）';
      });
    }
    else document.getElementById('styStatus').textContent = '❌ 保存失败: ' + (d.message||'');
  }).catch(function(e) {
    document.getElementById('styStatus').textContent = '❌ 保存失败: ' + e.message;
  });
};

function loadNavbar() {
  var main = document.getElementById('main');
  if (!main) { alert('main element missing'); return; }
  main.innerHTML = '<p>加载中...</p>';
  gh('/repos/' + REPO + '/contents/_layouts/default.html?ref=' + BRANCH).then(function(meta) {
    if (!meta || meta.message) { main.innerHTML = '<p class="red">' + (meta ? meta.message : '空响应') + '</p>'; return; }
    if (!meta.content) { main.innerHTML = '<p class="red">响应中没有文件内容</p>'; return; }
    window._navSha = meta.sha;
    var raw = meta.content.replace(/\n/g, '').replace(/\r/g, '');
    var content = atob(raw);
    try { content = decodeURIComponent(escape(content)); } catch(e) {}
    if (content.length < 10) { main.innerHTML = '<p class="red">文件内容为空</p>'; return; }
    window._navHtml = content;
    // Parse existing nav items from <ul> in navbar
    var navMatch = content.match(/<ul>([\s\S]*?)<\/ul>/i);
    var items = [];
    if (navMatch) {
      var re = /<li><a\s+href="([^"]+)"[^>]*>([^<]+)<\/a><\/li>/gi;
      var m;
      while ((m = re.exec(navMatch[1])) !== null) {
        items.push({ href: m[1], label: m[2] });
      }
    }
    if (items.length === 0) {
      items = [
        { href: '{{ site.baseurl }}/', label: '首页' },
        { href: '{{ site.baseurl }}/dllhn', label: 'DllHN' },
        { href: '{{ site.baseurl }}/csel-standalone', label: 'CSEL 独立版' },
        { href: '{{ site.baseurl }}/csel-mod', label: 'CSEL Mod' }
      ];
    }
    window._navItems = items;
    renderNavEditor();
  }).catch(function(e) {
    main.innerHTML = '<p class="red">请求失败: ' + (e.message||e) + '</p>';
  });
}

function renderNavEditor() {
  var main = document.getElementById('main');
  var items = window._navItems || [];
  var listHtml = '';
  items.forEach(function(item, i) {
    listHtml += '<tr>';
    listHtml += '<td style="cursor:move;font-size:18px;opacity:.4" onclick="moveNavItem(' + i + ',-1)">↑</td>';
    listHtml += '<td style="cursor:move;font-size:18px;opacity:.4" onclick="moveNavItem(' + i + ',1)">↓</td>';
    listHtml += '<td><input type="text" id="nlabel' + i + '" value="' + escHtml(item.label) + '" style="width:100%" /></td>';
    listHtml += '<td><input type="text" id="nhref' + i + '" value="' + escHtml(item.href) + '" style="width:100%;font-size:12px;" /></td>';
    listHtml += '<td><button class="btn btn-sm btn-red" onclick="delNavItem(' + i + ')">✕</button></td>';
    listHtml += '</tr>';
  });

  main.innerHTML = `
<div class="page-bar"><h2>🔗 导航栏</h2></div>
<div class="warn"><b>💡</b> 添加、删除、排序导航链接。点 ↑↓ 调整顺序。</div>
<table>
<tr><th style="width:30px"></th><th style="width:30px"></th><th>名称</th><th>链接</th><th style="width:50px"></th></tr>
${listHtml}
</table>
<div style="margin:12px 0"><button class="btn btn-sm" onclick="addNavItem()">+ 添加链接</button></div>
<div style="margin-top:16px"><button class="btn" onclick="saveNavbar()">💾 保存导航栏</button> <span id="navStatus" class="dim"></span></div>`;
}

window.addNavItem = function() {
  if (!window._navItems) window._navItems = [];
  window._navItems.push({ href: '{{ site.baseurl }}/new-page', label: '新页面' });
  renderNavEditor();
};

window.delNavItem = function(i) {
  window._navItems.splice(i, 1);
  renderNavEditor();
};

window.moveNavItem = function(i, dir) {
  var items = window._navItems;
  var j = i + dir;
  if (j < 0 || j >= items.length) return;
  var tmp = items[i];
  items[i] = items[j];
  items[j] = tmp;
  renderNavEditor();
};

window.saveNavbar = function() {
  var items = window._navItems || [];
  var listHtml = '';
  items.forEach(function(item, idx) {
    var label = document.getElementById('nlabel' + idx);
    var href = document.getElementById('nhref' + idx);
    listHtml += '    <li><a href="' + (href ? href.value.trim() : item.href) + '">' + (label ? label.value.trim() : item.label) + '</a></li>\n';
  });
  listHtml = listHtml.replace(/\{\{site\.baseurl\}\}/g, '{{ site.baseurl }}');

  // Replace the nav <ul> in the template
  var html = window._navHtml;
  html = html.replace(/<ul>[\s\S]*?<\/ul>/i, '<ul>\n' + listHtml + '  </ul>');

  document.getElementById('navStatus').textContent = '保存中...';
  var body = {
    message: 'update navbar',
    content: b64enc(html),
    branch: BRANCH
  };
  if (window._navSha) body.sha = window._navSha;

  gh('/repos/' + REPO + '/contents/_layouts/default.html', { method: 'PUT', body: JSON.stringify(body) }).then(function(d) {
    if (d.content) {
      window._navSha = d.content.sha;
      window._navHtml = html;
      document.getElementById('navStatus').textContent = '✅ 已保存';
    } else {
      document.getElementById('navStatus').textContent = '❌ 保存失败: ' + (d.message||'');
    }
  });
};

function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Init ──
render();
</script>
