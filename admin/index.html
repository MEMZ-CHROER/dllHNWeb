<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CSEL 后台管理</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a0f; color:#c8c8d0; font:15px/1.7 'Consolas',monospace; min-height:100vh; }
a { color:#1e90ff; text-decoration:none; }
input,textarea,select { font:14px/1.5 'Consolas',monospace; background:#111; border:1px solid #2a2a3a; color:#fff; padding:8px 10px; }
input:focus,textarea:focus,select:focus { border-color:#00d4aa; outline:none; }
button { font:14px 'Consolas',monospace; cursor:pointer; }
.green { color:#00d4aa; }
.red { color:#e74c3c; }
.dim { opacity:.6; }

/* Layout */
.app { display:flex; height:100vh; }
.sidebar { width:220px; background:#0e0e16; border-right:1px solid #2a2a3a; padding:16px 0; flex-shrink:0; }
.sidebar .logo { padding:8px 20px 16px; font-weight:bold; color:#00d4aa; font-size:17px; border-bottom:1px solid #2a2a3a; margin-bottom:8px; }
.sidebar .nav-item { display:block; padding:8px 20px; color:#aaa; cursor:pointer; }
.sidebar .nav-item:hover, .sidebar .nav-item.active { color:#fff; background:#1a1a28; }
.main { flex:1; overflow-y:auto; padding:24px 32px; }

/* Login */
.login-wrap { max-width:400px; margin:120px auto; padding:0 20px; }
.login-wrap h1 { color:#00d4aa; margin-bottom:16px; }
.login-wrap input { width:100%; margin:8px 0; }
.login-wrap .btn { width:100%; padding:12px; background:#00d4aa; color:#000; border:none; font-weight:bold; margin:12px 0; }
.login-wrap .hint { font-size:13px; }

/* Page */
.page-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.page-bar h2 { color:#00d4aa; }
.btn { padding:8px 16px; border:1px solid #00d4aa; background:transparent; color:#00d4aa; }
.btn:hover { background:#00d4aa; color:#000; }
.btn-sm { padding:4px 10px; font-size:12px; }
.btn-red { border-color:#e74c3c; color:#e74c3c; }
.btn-red:hover { background:#e74c3c; color:#fff; }
.btn-amber { border-color:#f39c12; color:#f39c12; }
.btn-amber:hover { background:#f39c12; color:#000; }

/* Table */
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:10px 12px; border-bottom:1px solid #2a2a3a; }
th { color:#666; font-weight:normal; font-size:13px; }

/* Modal */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; z-index:100; }
.modal { background:#1a1a28; border:1px solid #2a2a3a; width:680px; max-width:90vw; max-height:85vh; overflow-y:auto; padding:24px; }
.modal h3 { color:#00d4aa; margin-bottom:16px; }
.modal label { display:block; margin:12px 0 4px; font-size:13px; opacity:.7; }
.modal input, .modal textarea { width:100%; }
.modal textarea { min-height:50vh; }
.modal .btns { display:flex; gap:10px; margin-top:16px; }

/* Warning */
.warn { background:#1a1a28; border:1px solid #f39c12; padding:12px 16px; margin:12px 0; font-size:13px; }
.warn b { color:#f39c12; }
</style>
</head>
<body>

<div id="app"></div>

<script>
const REPO = 'MEMZ-CHROER/dllHNWeb';
const BRANCH = 'master';
const SITE = '.';
var TOKEN = null;
var shaMap = {};

// ── 密码 ──
var _pwHex = '447265616447656d34323233393436';

// ── GitHub API ──
function gh(url, opts) {
  var sep = url.indexOf('?') > -1 ? '&' : '?';
  return fetch('https://api.github.com' + url + sep + '_t=' + Date.now(), Object.assign({
    headers: { Authorization: 'Bearer ' + TOKEN, Accept: 'application/vnd.github.v3+json' }
  }, opts || {})).then(function(r) {
    if (r.status === 401) { TOKEN=null; localStorage.removeItem('csel_token'); render(); throw new Error('Token expired'); }
    return r.json().catch(function() {
      return r.text().then(function(t) { throw new Error('HTTP ' + r.status + ': ' + t.substring(0,80)); });
    });
  });
}

function ghRaw(url) {
  var sep = url.indexOf('?') > -1 ? '&' : '?';
  return fetch('https://api.github.com' + url + sep + '_t=' + Date.now(), {
    headers: { Authorization: 'Bearer ' + TOKEN, Accept: 'application/vnd.github.v3.raw' }
  }).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + url);
    return r.text().then(function(t) {
      // Check if API returned JSON instead of raw content
      if (t.charAt(0) === '{' || t.charAt(0) === '[') {
        try { var j = JSON.parse(t); if (j.name || j.message) throw new Error('API returned JSON: ' + (j.message || j.name)); } catch(e) { if (e.message.indexOf('API')>-1) throw e; }
      }
      return t;
    });
  });
}

function b64enc(s) { return btoa(unescape(encodeURIComponent(s))); }
function b64dec(s) { return decodeURIComponent(escape(atob(s))); }

// ── Page States ──
var state = 'pages';

function render() {
  if (!TOKEN) return renderLogin();
  var html = '';
  html += '<div class="app">';
  html += '<div class="sidebar">';
  html += '<div class="logo">[CSEL] Admin</div>';
  html += '<a class="nav-item'+(state==='pages'?' active':'')+'" onclick="go(\'pages\')">📄 页面管理</a>';
  html += '<a class="nav-item'+(state==='navbar'?' active':'')+'" onclick="go(\'navbar\')">🔗 导航栏</a>';
  html += '<a class="nav-item'+(state==='new'?' active':'')+'" onclick="go(\'new\')">➕ 新建页面</a>';
  html += '<a class="nav-item" onclick="logout()" style="color:#666;margin-top:20px;">🚪 退出</a>';
  html += '</div>';
  html += '<div class="main" id="main"></div>';
  html += '</div>';
  document.getElementById('app').innerHTML = html;
  loadPage();
}

function go(s) { state=s; render(); }

function logout() { TOKEN=null; localStorage.removeItem('csel_token'); render(); }

// ── Render Login ──
function renderLogin() {
  var saved = localStorage.getItem('csel_token');
  if (saved) {
    TOKEN = saved;
    render();
    return;
  }
  document.getElementById('app').innerHTML = `
<div class="login-wrap">
  <h1>[CSEL] 后台管理</h1>
  <p class="dim">输入管理密码</p>
  <input type="password" id="t" placeholder="密码" />
  <button class="btn" onclick="login()">登录</button>
</div>`;
}
function _hex(s) { var r='';for(var i=0;i<s.length;i+=2)r+=String.fromCharCode(parseInt(s.substr(i,2),16));return r; }
window.login = function() {
  var v = document.getElementById('t').value;
  if (v === _hex(_pwHex)) {
    TOKEN = localStorage.getItem('csel_token');
    if (!TOKEN) {  // 首次：输完密码再输 token
      document.getElementById('app').innerHTML = '<div class="login-wrap"><h1>[CSEL] 后台管理</h1><p class="green">✅ 密码正确</p><p class="dim">输入 GitHub Token（一次性的，存本地）</p><input type="text" id="tk" placeholder="github_pat_..." /><button class="btn" onclick="saveToken()">保存</button></div>';
      return;
    }
    render();
  } else {
    document.getElementById('app').innerHTML = '<div class="login-wrap"><h1>[CSEL] 后台管理</h1><p class="red">❌ 密码错误</p><input type="password" id="t" placeholder="密码" /><button class="btn" onclick="login()">登录</button></div>';
  }
};
window.saveToken = function() {
  var v = document.getElementById('tk').value.trim();
  if (!v) return;
  localStorage.setItem('csel_token', v);
  TOKEN = v;
  render();
};

// ── Page List ──
function loadPage() {
  if (state === 'pages') loadList();
  else if (state === 'navbar') loadNavbar();
  else if (state === 'new') loadNew();
}

function loadList() {
  document.getElementById('main').innerHTML = '<p>加载中...</p>';
  gh('/repos/' + REPO + '/git/trees/' + BRANCH + '?recursive=1').then(function(data) {
    if (data.message) { document.getElementById('main').innerHTML = '<p class="red">' + data.message + '</p>'; return; }
    var mds = data.tree.filter(function(f) { return (f.path.endsWith('.md') || f.path.endsWith('.html')) && f.path.indexOf('node_modules')===-1 && f.path !== 'README.md'; });
    data.tree.forEach(function(f) { shaMap[f.path] = f.sha; });

    var html = '<div class="page-bar"><h2>📄 页面管理</h2><button class="btn" onclick="go(\'new\')">+ 新建页面</button></div>';
    html += '<table><tr><th>文件</th><th>标题</th><th style="width:240px">操作</th></tr>';
    mds.forEach(function(f) {
      var title = f.path.replace('.md','').replace(/^content\/pages\//,'').replace(/\//g,' / ');
      html += '<tr><td><a href="' + SITE + '/' + f.path.replace('.md','') + '" target="_blank">' + f.path + '</a></td>';
      html += '<td class="dim">' + title + '</td>';
      html += '<td><button class="btn btn-sm" onclick="editFile(\'' + f.path + '\')">编辑</button> ';
      html += '<button class="btn btn-sm btn-amber" onclick="quickPublish(\'' + f.path + '\')">⚡发布</button> ';
      html += '<button class="btn btn-sm btn-red" onclick="delFile(\'' + f.path + '\')">删除</button></td></tr>';
    });
    html += '</table><p class="dim" style="margin-top:8px">⚡发布 = 直接提交 HTML 版本，立刻生效（不等 Pages 构建）</p>';
    document.getElementById('main').innerHTML = html;
  });
}

// ── Edit File ──
function editFile(path) {
  ghRaw('/repos/' + REPO + '/contents/' + path + '?ref=' + BRANCH).then(function(content) {
    showModal(path, content);
  });
}

function showModal(path, content) {
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
<div class="modal">
  <h3>编辑: ${path}</h3>
  <label>文件名</label><input type="text" id="mpath" value="${path}" />
  <label>内容 (Markdown)</label><textarea id="mcontent">${escHtml(content||'')}</textarea>
  <div class="btns">
    <button class="btn" onclick="saveModal()">💾 保存</button>
    <button class="btn btn-red" onclick="closeModal()">取消</button>
  </div>
</div>`;
  document.body.appendChild(overlay);
  window._modalPath = path;
}

window.saveModal = function() {
  var path = document.getElementById('mpath').value.trim();
  var content = document.getElementById('mcontent').value;
  if (!path || !content) return;
  closeModal();
  var main = document.getElementById('main');
  main.innerHTML = '<p>保存中...</p>';

  var body = { message: 'update ' + path, content: b64enc(content), branch: BRANCH };
  if (shaMap[path]) body.sha = shaMap[path];

  gh('/repos/' + REPO + '/contents/' + path, { method: 'PUT', body: JSON.stringify(body) }).then(function(d) {
    if (d.content) { shaMap[path] = d.content.sha; loadList(); }
    else main.innerHTML = '<p class="red">保存失败: ' + (d.message||'unknown') + '</p>';
  });
};

window.closeModal = function() {
  var el = document.querySelector('.modal-overlay');
  if (el) el.remove();
};

// ── Quick Publish (render HTML immediately) ──
window.quickPublish = function(path) {
  var main = document.getElementById('main');
  main.innerHTML = '<p>⚡ 渲染并发布 ' + path + '...</p>';

  // Load marked if not yet loaded
  if (!window.marked) {
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/marked/marked.min.js';
    s.onload = function() { doPublish(path); };
    document.body.appendChild(s);
  } else {
    doPublish(path);
  }
};

function doPublish(path) {
  var main = document.getElementById('main');
  ghRaw('/repos/' + REPO + '/contents/' + path + '?ref=' + BRANCH).then(function(md) {
    // Get layout for wrapper
    ghRaw('/repos/' + REPO + '/contents/_layouts/default.html?ref=' + BRANCH).then(function(layout) {
      // Debug: check first 50 chars
      if (layout.charAt(0) === '{') {
        main.innerHTML = '<p class="red">❌ API 返回了 JSON 而非文件内容。token 可能权限不足。</p>';
        return;
      }
      var htmlPath = path.replace('.md', '.html');
      var title = path.replace('.md','').split('/').pop();

      // Extract YAML frontmatter title
      var titleMatch = md.match(/^---[\s\S]*?title:\s*(.+)[\s\S]*?---/);
      if (titleMatch) title = titleMatch[1].trim();

      // Strip frontmatter, render markdown
      var body = md.replace(/^---[\s\S]*?---\s*/, '');
      var rendered = marked.parse(body);

      // Build complete HTML: replace layout vars FIRST, then content last
      var pageHtml = layout
        .replace(/{{ page\.title }}/g, title)
        .replace(/{{ site\.title }}/g, 'DllHN · CSEL')
        .replace(/{{ site\.baseurl }}/g, '')
        .replace(/{{ page\.url }}/g, '/' + htmlPath)
        .replace(/{{ content }}/g, function() { return rendered; });

      // Get SHA if html file already exists
      var sha = null;
      if (shaMap[htmlPath]) sha = shaMap[htmlPath];

      var body2 = { message: 'quick publish ' + htmlPath, content: b64enc(pageHtml), branch: BRANCH };
      if (sha) body2.sha = sha;

      main.innerHTML = '<p>⏫ 提交 HTML 到 GitHub...</p>';
      gh('/repos/' + REPO + '/contents/' + htmlPath, { method: 'PUT', body: JSON.stringify(body2) }).then(function(d) {
        if (d.content) {
          shaMap[htmlPath] = d.content.sha;
          main.innerHTML = '<p class="green">✅ 静态页已发布！<a href="/' + htmlPath + '" target="_blank">立即查看</a></p>';
          // 同时触发 Pages 重建，让 Jekyll 版也跟上
          main.innerHTML += '<p class="dim">⏫ 正在触发 Pages 重建...</p>';
          gh('/repos/' + REPO + '/pages/builds', { method: 'POST' }).then(function(b) {
            main.innerHTML += '<p class="green">✅ Pages 重建中（约 30 秒），刷新后可用 Jekyll 版本</p>';
          }).catch(function(e) {
            main.innerHTML += '<p class="dim">⚠ Pages 重建触发失败（不影响已发布的静态页）</p>';
          });
        } else {
          main.innerHTML = '<p class="red">发布失败: ' + (d.message||'') + '</p>';
        }
      });
    });
  }).catch(function(e) {
    main.innerHTML = '<p class="red">发布失败: ' + e.message + '</p>';
  });
}

window.delFile = function(path) {
  if (!confirm('确定删除 ' + path + ' ？')) return;
  var sha = shaMap[path];
  if (!sha) { alert('找不到文件 SHA'); return; }
  document.getElementById('main').innerHTML = '<p>删除中...</p>';
  gh('/repos/' + REPO + '/contents/' + path, {
    method: 'DELETE',
    body: JSON.stringify({ message: 'delete ' + path, sha: sha, branch: BRANCH })
  }).then(function(d) {
    if (!d.message || d.message === 'delete ' + path) loadList();
    else document.getElementById('main').innerHTML = '<p class="red">删除失败: ' + (d.message||'unknown') + '</p>';
  });
};

// ── New Page ──
function loadNew() {
  document.getElementById('main').innerHTML = `
<div class="page-bar"><h2>➕ 新建页面</h2></div>
<label style="display:block;margin:8px 0 4px;opacity:.7">文件名 (不含 .md)</label>
<input type="text" id="npath" placeholder="my-page" />
<label style="display:block;margin:12px 0 4px;opacity:.7">内容 (Markdown)</label>
<textarea id="ncontent" style="width:100%;min-height:50vh;background:#111;border:1px solid #2a2a3a;color:#fff;padding:12px;font:14px/1.6 monospace;">---
title: 新页面
---

在这里写内容...
</textarea>
<div style="margin-top:12px">
  <button class="btn" onclick="createPage()">创建页面</button>
</div>`;
}

window.createPage = function() {
  var name = document.getElementById('npath').value.trim();
  var content = document.getElementById('ncontent').value;
  if (!name) { alert('请输入文件名'); return; }
  var path = name + (name.endsWith('.md') ? '' : '.md');
  document.getElementById('main').innerHTML = '<p>创建中...</p>';
  gh('/repos/' + REPO + '/contents/' + path, {
    method: 'PUT',
    body: JSON.stringify({ message: 'create ' + path, content: b64enc(content), branch: BRANCH })
  }).then(function(d) {
    if (d.content) { shaMap[path] = d.content.sha; go('pages'); }
    else document.getElementById('main').innerHTML = '<p class="red">创建失败: ' + (d.message||'unknown') + '</p>';
  });
};

// ── Navbar Editor ──
function loadNavbar() {
  var main = document.getElementById('main');
  if (!main) { alert('main element missing'); return; }
  main.innerHTML = '<p>加载中...</p>';
  gh('/repos/' + REPO + '/contents/_layouts/default.html?ref=' + BRANCH).then(function(meta) {
    if (!meta || meta.message) { main.innerHTML = '<p class="red">' + (meta ? meta.message : '空响应') + '</p>'; return; }
    if (!meta.content) { main.innerHTML = '<p class="red">响应中没有文件内容</p>'; return; }
    window._navSha = meta.sha;
    var raw = meta.content.replace(/\n/g, '').replace(/\r/g, '');
    var content = atob(raw);
    try { content = decodeURIComponent(escape(content)); } catch(e) {}
    if (content.length < 10) { main.innerHTML = '<p class="red">文件内容为空</p>'; return; }
    window._navHtml = content;
    // Parse existing nav items from <ul> in navbar
    var navMatch = content.match(/<ul>([\s\S]*?)<\/ul>/i);
    var items = [];
    if (navMatch) {
      var re = /<li><a\s+href="([^"]+)"[^>]*>([^<]+)<\/a><\/li>/gi;
      var m;
      while ((m = re.exec(navMatch[1])) !== null) {
        items.push({ href: m[1], label: m[2] });
      }
    }
    if (items.length === 0) {
      items = [
        { href: '{{ site.baseurl }}/', label: '首页' },
        { href: '{{ site.baseurl }}/dllhn', label: 'DllHN' },
        { href: '{{ site.baseurl }}/csel-standalone', label: 'CSEL 独立版' },
        { href: '{{ site.baseurl }}/csel-mod', label: 'CSEL Mod' }
      ];
    }
    window._navItems = items;
    renderNavEditor();
  }).catch(function(e) {
    main.innerHTML = '<p class="red">请求失败: ' + (e.message||e) + '</p>';
  });
}

function renderNavEditor() {
  var main = document.getElementById('main');
  var items = window._navItems || [];
  var listHtml = '';
  items.forEach(function(item, i) {
    listHtml += '<tr>';
    listHtml += '<td style="cursor:move;font-size:18px;opacity:.4" onclick="moveNavItem(' + i + ',-1)">↑</td>';
    listHtml += '<td style="cursor:move;font-size:18px;opacity:.4" onclick="moveNavItem(' + i + ',1)">↓</td>';
    listHtml += '<td><input type="text" id="nlabel' + i + '" value="' + escHtml(item.label) + '" style="width:100%" /></td>';
    listHtml += '<td><input type="text" id="nhref' + i + '" value="' + escHtml(item.href) + '" style="width:100%;font-size:12px;" /></td>';
    listHtml += '<td><button class="btn btn-sm btn-red" onclick="delNavItem(' + i + ')">✕</button></td>';
    listHtml += '</tr>';
  });

  main.innerHTML = `
<div class="page-bar"><h2>🔗 导航栏</h2></div>
<div class="warn"><b>💡</b> 添加、删除、排序导航链接。点 ↑↓ 调整顺序。</div>
<table>
<tr><th style="width:30px"></th><th style="width:30px"></th><th>名称</th><th>链接</th><th style="width:50px"></th></tr>
${listHtml}
</table>
<div style="margin:12px 0"><button class="btn btn-sm" onclick="addNavItem()">+ 添加链接</button></div>
<div style="margin-top:16px"><button class="btn" onclick="saveNavbar()">💾 保存导航栏</button> <span id="navStatus" class="dim"></span></div>`;
}

window.addNavItem = function() {
  if (!window._navItems) window._navItems = [];
  window._navItems.push({ href: '{{ site.baseurl }}/new-page', label: '新页面' });
  renderNavEditor();
};

window.delNavItem = function(i) {
  window._navItems.splice(i, 1);
  renderNavEditor();
};

window.moveNavItem = function(i, dir) {
  var items = window._navItems;
  var j = i + dir;
  if (j < 0 || j >= items.length) return;
  var tmp = items[i];
  items[i] = items[j];
  items[j] = tmp;
  renderNavEditor();
};

window.saveNavbar = function() {
  var items = window._navItems || [];
  var listHtml = '';
  items.forEach(function(item, idx) {
    var label = document.getElementById('nlabel' + idx);
    var href = document.getElementById('nhref' + idx);
    listHtml += '    <li><a href="' + (href ? href.value.trim() : item.href) + '">' + (label ? label.value.trim() : item.label) + '</a></li>\n';
  });
  listHtml = listHtml.replace(/\{\{site\.baseurl\}\}/g, '{{ site.baseurl }}');

  // Replace the nav <ul> in the template
  var html = window._navHtml;
  html = html.replace(/<ul>[\s\S]*?<\/ul>/i, '<ul>\n' + listHtml + '  </ul>');

  document.getElementById('navStatus').textContent = '保存中...';
  var body = {
    message: 'update navbar',
    content: b64enc(html),
    branch: BRANCH
  };
  if (window._navSha) body.sha = window._navSha;

  gh('/repos/' + REPO + '/contents/_layouts/default.html', { method: 'PUT', body: JSON.stringify(body) }).then(function(d) {
    if (d.content) {
      window._navSha = d.content.sha;
      window._navHtml = html;
      document.getElementById('navStatus').textContent = '✅ 已保存';
    } else {
      document.getElementById('navStatus').textContent = '❌ 保存失败: ' + (d.message||'');
    }
  });
};

function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Init ──
render();
</script>
</body>
</html>
