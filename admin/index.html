<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSEL 后台管理</title>
  <style>
    body { margin:0; background:#0a0a0f; color:#c8c8d0; font:15px/1.7 monospace; }
    .wrap { max-width:480px; margin:80px auto; padding:0 20px; }
    h1 { color:#00d4aa; }
    input, .btn { width:100%; padding:10px; box-sizing:border-box; }
    input { background:#111; border:1px solid #2a2a3a; color:#fff; font:14px monospace; }
    input:focus { border-color:#00d4aa; outline:none; }
    .btn { display:block; padding:12px; background:#00d4aa; color:#0a0a0f; border:none; font:15px monospace; font-weight:bold; cursor:pointer; }
    .btn:hover { opacity:.9; }
    a { color:#1e90ff; }
    .ok { color:#00d4aa; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>
  <script>
  (function() {
    var app = document.getElementById('app');

    // 拦截 popup — 不让 CMS 开弹窗
    var origOpen = window.open;
    window.open = function() { return { close: function(){}, closed: true }; };

    // 注入 token：CMS 登录页面会监听 postMessage
    function injectToken(token) {
      localStorage.setItem('csel_token', token);
      // 等 CMS 的 AuthenticationPage 挂载好，发消息
      var tryCount = 0;
      var timer = setInterval(function() {
        tryCount++;
        window.dispatchEvent(new MessageEvent('message', {
          data: { type: 'authorization', data: { token: token } },
          origin: window.location.origin
        }));
        if (tryCount > 30) clearInterval(timer);  // 最多试 30 次
      }, 500);
    }

    var saved = localStorage.getItem('csel_token');
    if (saved) {
      app.innerHTML = '<p class="ok">✓ 检测到已保存的 Token</p>';
      // 先加载 CMS，再注入
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/netlify-cms@2.10.180/dist/netlify-cms.js';
      s.onload = function() {
        setTimeout(function() { injectToken(saved); }, 1500);
      };
      document.body.appendChild(s);
    } else {
      app.innerHTML =
        '<h1>[CSEL] 后台管理</h1>' +
        '<p>输入 GitHub Personal Access Token：</p>' +
        '<input type="text" id="t" placeholder="github_pat_..." />' +
        '<button class="btn" onclick="doLogin()">登录</button>' +
        '<p class="hint">去 <a href="https://github.com/settings/tokens/new?scopes=repo,user&description=CSEL-CMS" target="_blank">GitHub 生成 token</a>（勾选 repo + user）</p>';

      window.doLogin = function() {
        var v = document.getElementById('t').value.trim();
        if (!v) return;
        app.innerHTML = '<p class="ok">✓ Token 已保存，加载管理界面...</p>';
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/netlify-cms@2.10.180/dist/netlify-cms.js';
        s.onload = function() {
          setTimeout(function() { injectToken(v); }, 1500);
        };
        document.body.appendChild(s);
      };
    }
  })();
  </script>
</body>
</html>
