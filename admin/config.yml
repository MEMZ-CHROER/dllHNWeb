# ── Decap CMS 配置 ──
# 在 GitHub 上创建一个 OAuth App 后填入 client_id

backend:
  name: github
  repo: MEMZ-CHROER/dllHNWeb
  branch: master
  base_url: https://hn.liuxiyu.cn
  auth_endpoint: auth

publish_mode: editorial_workflow
media_folder: assets/img
public_folder: /assets/img

collections:
  - name: pages
    label: 页面
    label_singular: 页面
    folder: /
    create: true
    extension: md
    slug: "{{slug}}"
    preview_path: "{{slug}}"
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 内容, name: body, widget: markdown }
