# ── Decap CMS 配置 ──
# OAuth 通过 Cloudflare Worker (/auth) 代理 GitHub

backend:
  name: github
  repo: MEMZ-CHROER/dllHNWeb
  branch: master

publish_mode: editorial_workflow
media_folder: assets/img
public_folder: /assets/img
locale: zh_Hans

collections:
  - name: pages
    label: 页面
    label_singular: 页面
    folder: /
    filter: { field: "extension", pattern: ".md" }
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    summary: "{{title}} — {{filename}}"
    fields:
      - { label: 标题, name: title, widget: string, required: false }
      - { label: 布局模板, name: layout, widget: hidden, default: default }
      - { label: 内容, name: body, widget: markdown }

  - name: wiki
    label: 百科
    label_singular: 百科条目
    folder: /hacknet
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    summary: "{{title}}"
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 内容, name: body, widget: markdown }
