# ── Decap CMS 配置 ──
# 在 GitHub 上创建一个 OAuth App 后填入 client_id

backend:
  name: github
  repo: 你的用户名/你的仓库名     # 例如: CSEL-Team/DllHN
  branch: main
  base_url: https://你的域名       # 例如: https://csel.example.com
  # 如果不用自定义域名，用 GitHub Pages 地址：
  # base_url: https://你的用户名.github.io/仓库名

publish_mode: editorial_workflow
media_folder: assets/img
public_folder: /assets/img

collections:
  - name: pages
    label: 页面
    label_singular: 页面
    folder: /
    create: true
    extension: md
    slug: "{{slug}}"
    preview_path: "{{slug}}"
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 内容, name: body, widget: markdown }
